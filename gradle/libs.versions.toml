koin-viewModel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

datastore = { module = "de.charlex.settings:settings-datastore", version.ref = "datastore" }

datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "date-time" }
stately-common = { module = "co.touchlab:stately-common", version.ref = "stately-common" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight-driver = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
